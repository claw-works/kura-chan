; Kura-chan Firmware - M5Stack StackChan (K151)
; Based on ESP32-S3 CoreS3

[env:kura-chan]
platform = espressif32
board = m5stack-cores3
framework = arduino

; Upload settings
upload_speed = 1500000
monitor_speed = 115200

; Filesystem: config.json lives on LittleFS (decoupled from firmware).
; Edit data/config.json then `pio run -t uploadfs` to push config without reflashing.
board_build.filesystem = littlefs

; Libraries
lib_deps =
    m5stack/M5Unified@^0.2.4
    m5stack/M5GFX@^0.2.8
    links2004/WebSockets@^2.6.1
    bblanchon/ArduinoJson@^7
    https://github.com/meganetaaan/m5stack-avatar.git
