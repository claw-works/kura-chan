; Kura-chan Firmware - M5Stack StackChan (K151)
; Based on ESP32-S3 CoreS3

[env:kura-chan]
platform = espressif32
board = m5stack-cores3
framework = arduino

; Upload settings
upload_speed = 1500000
monitor_speed = 115200

; Libraries
lib_deps =
    m5stack/M5Unified@^0.2.4
    m5stack/M5GFX@^0.2.8
