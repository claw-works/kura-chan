# Local dev datastores for kura-chan-server.
#   postgres: user/pass/db = dev/dev/dev   (DATABASE_URL=postgres://dev:dev@localhost:5432/dev)
#   redis:    password dev                 (redis://:dev@localhost:6379)
services:
  postgres:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: dev
    ports:
      - "5432:5432"
    volumes:
      - kura_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    restart: always
    command: ["redis-server", "--requirepass", "dev"]
    ports:
      - "6379:6379"
    volumes:
      - kura_redisdata:/data

volumes:
  kura_pgdata:
  kura_redisdata:
