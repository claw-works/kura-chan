<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>小爪</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <div id="app">
      <div id="status" class="status">连接中…</div>
      <div id="stage" class="stage" data-tauri-drag-region>
        <img id="portrait" class="portrait" alt="小爪" />
        <img id="face" class="face" alt="" />
      </div>
      <div id="bubble" class="bubble"></div>
      <form id="chat-form" class="chat">
        <button type="button" id="mic-btn" title="点击说话，再点一下结束">🎤</button>
        <input id="chat-input" placeholder="跟小爪说点什么…" autocomplete="off" />
        <button type="submit">发送</button>
      </form>
    </div>
  </body>
</html>
