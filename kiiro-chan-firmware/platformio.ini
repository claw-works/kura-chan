; Kiiro-chan Firmware
; 学而思编程掌机 (经典 ESP32-D0WD, revision v1.0) 重刷固件
; 具体外设(屏幕/按键/其他)尚待确认，先用通用 esp32dev 板型作为最小骨架。

[env:kiiro-chan]
platform = espressif32
board = esp32dev
framework = arduino

; 芯片确认信息 (esptool chip-id 读取):
;   Chip type: ESP32-D0WD (revision v1.0)
;   Features: Wi-Fi, BT, Dual Core + LP Core, 240MHz
;   Crystal: 40MHz
;   MAC: 90:38:0c:d1:ff:34

upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; 3MB app 分区（无 OTA）：容纳嵌入的中文字库 (~300KB) 与后续功能
board_build.partitions = huge_app.csv

; 嵌入点阵字库: HZK16(GB2312 16x16) + ASC16(8x16) + Unicode→GB2312 映射表
; 访问符号: _binary_data_hzk16_bin_start 等
board_build.embed_files =
    data/hzk16.bin
    data/asc16.bin
    data/u2g.bin

; --- TFT_eSPI 配置：通过 build_flags 定义驱动型号和引脚 ---
; ST7735 128x160，与 xueersi-xiaomiao 引脚一致：
;   SCK=18 MOSI=23 (与SD卡共享总线) CS=5 DC=4 RST=19
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    links2004/WebSockets@^2.6.1
    bblanchon/ArduinoJson@^7

build_flags =
    -D USER_SETUP_LOADED=1
    -D ST7735_DRIVER=1
    -D TFT_WIDTH=128
    -D TFT_HEIGHT=160
    -D ST7735_GREENTAB160x128
    -D TFT_RGB_ORDER=TFT_RGB
    -D TFT_MOSI=23
    -D TFT_SCLK=18
    -D TFT_CS=5
    -D TFT_DC=4
    -D TFT_RST=19
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D SPI_FREQUENCY=27000000
