<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>小爪</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <div id="app">
      <div id="stage" class="stage">
        <img id="portrait" class="portrait" alt="小爪" draggable="false" />
        <img id="face" class="face" alt="" draggable="false" />
      </div>
      <div id="bubble" class="bubble"></div>
      <div id="menu">
        <span id="dot" class="dot" title="连接状态"></span>
        <button type="button" id="voice-btn" title="语音">🎤</button>
        <button type="button" id="text-btn" title="文字">💬</button>
        <button type="button" id="size-btn" title="大小">⊙</button>
        <button type="button" id="settings-btn" title="设置">⚙</button>
        <button type="button" id="ghost-btn" title="穿透点击（按全局热键唤回）">👻</button>
      </div>
      <div id="chatbox" class="chatbox">
        <div id="chat-log"></div>
        <div id="chat-bar">
          <button type="button" id="tts-btn" title="语音播放开关">🔊</button>
          <input id="chat-input" placeholder="说点什么…" autocomplete="off" />
          <button type="button" id="chat-send">发送</button>
          <button type="button" id="chat-exit" title="返回">×</button>
        </div>
      </div>
      <div id="settings" class="settings">
        <h3>设置</h3>
        <label>Server WS 地址<input id="set-ws" placeholder="ws://host:port/ws/device" /></label>
        <label>HTTP 地址<input id="set-http" placeholder="http://host:port" /></label>
        <label>API Key<input id="set-key" placeholder="kc_..." /></label>
        <label>设备 ID<input id="set-dev" placeholder="KURA_DESKTOP_001" /></label>
        <div class="set-row">
          <button type="button" id="set-save">保存</button>
          <button type="button" id="set-cancel">关闭</button>
        </div>
        <p id="set-msg"></p>
      </div>
    </div>
  </body>
</html>
