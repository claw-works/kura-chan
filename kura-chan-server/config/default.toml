[server]
host = "0.0.0.0"
port = 26021

[auth]
api_keys = ["dev_key_001"]

[aws]
region = "us-west-2"
# harness_arn 不入 git。请通过环境变量 HARNESS_ARN 设置(账号相关)。
harness_arn = ""

[llm]
# 模型提供商格式: bedrock-harness | bedrock-converse | openai-chat | openai-responses | anthropic-messages
# (当前已实现: bedrock-harness, openai-chat; 其余待实现)
# base_url / api_key / model 不入 git, 通过环境变量设置:
#   LLM_FORMAT / LLM_BASE_URL / LLM_API_KEY / LLM_MODEL  (可选 LLM_HISTORY_TURNS)
# 例(DeepSeek): LLM_FORMAT=openai-chat LLM_BASE_URL=https://api.deepseek.com LLM_MODEL=deepseek-chat
format = "bedrock-harness"
history_turns = 20          # 传给无状态 provider(openai/anthropic) 的对话轮数
temperature = 0.8
max_tokens = 4096           # 输出上限(DeepSeek v4 支持很大; 语音回复其实很短, 这里放宽即可)
thinking = false            # DeepSeek v4: false=关闭思考, 响应更快更省 token(仅 openai-chat 生效)

# [agent].system_prompt 已移到 config/common_rules.md(DB common_rules 为权威, admin 可改)

[speech]
stt_provider = "volc"
tts_provider = "volc"
# Volcengine (豆包语音) resource ids and voice. API key comes from the
# VOLC_API_KEY environment variable (kept out of source/git).
volc_asr_resource_id = "volc.seedasr.sauc.duration"
volc_tts_resource_id = "seed-tts-2.0"
# 兜底音色; 实际音色按角色 actors.voice("provider/voiceid") 选, 仅当角色未设置时用这个
volc_tts_voice = "zh_female_sajiaoxuemei_uranus_bigtts"

[session]
timeout_seconds = 300
max_audio_buffer_bytes = 1000000

[growth]
# Numeric raising system (all tunable without recompiling).
base_xp = 3                 # XP per completed conversation turn
turn_energy = 4             # energy spent per turn (max 100)
xp_base = 50                # level curve: xp_need(L) = xp_base * L * (L+1)
energy_regen_per_hour = 20  # passive energy recovery per real hour
bond_max_delta = 5          # cap on |bond| change per turn

[growth.events]
# event XP rewards the agent flags via [event:LEVEL]
minor = 50
major = 200
epic = 500
