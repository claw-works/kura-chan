[package]
name = "kura-chan-server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["trace", "cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
figment = { version = "0.10", features = ["toml", "env"] }
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-bedrockagentcore = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
bytes = "1"
thiserror = "2"
futures-util = "0.3"
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "chrono", "json", "macros", "migrate"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
rand = "0.8"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies]
tokio-tungstenite = "0.26"
serde_json = "1"

# aws-runtime 1.7.4 (latest published) fails to compile its event-stream SigV4
# signer (src/auth/sigv4.rs: "cannot infer type parameter T" on `send`).
# AgentCore's invoke_harness uses event streams, which enables that code path.
# This vendored copy carries the turbofish fix. Remove once upstream ships a fix.
[patch.crates-io]
aws-runtime = { path = "patches/aws-runtime" }
